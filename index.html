<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AuraVest - منصة الاستثمار الذكي</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap');
        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #090d16;
            color: #f8fafc;
            padding-bottom: 84px;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.2s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen w-full overflow-x-hidden">

    <!-- شاشة تسجيل الدخول / إنشاء حساب -->
    <div id="authScreen" class="fixed inset-0 z-50 bg-[#090d16] flex items-center justify-center p-4">
        <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-6 space-y-5 shadow-2xl">
            <div class="flex flex-col items-center text-center space-y-2">
                <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-amber-500 to-yellow-300 flex items-center justify-center text-slate-950 font-black text-3xl shadow-lg shadow-amber-500/20">
                    A
                </div>
                <h1 class="font-black text-2xl bg-gradient-to-r from-amber-400 to-yellow-200 bg-clip-text text-transparent">
                    AuraVest
                </h1>
                <p id="authSubtitle" class="text-xs text-slate-400">سجل دخولك لمتابعة محفظتك واستثماراتك</p>
            </div>

            <div class="space-y-3">
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1">البريد الإلكتروني</label>
                    <input id="authEmail" type="email" placeholder="name@example.com" class="w-full px-4 py-3 rounded-2xl bg-slate-950 border border-slate-800 text-white text-sm focus:outline-none focus:border-amber-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1">كلمة المرور</label>
                    <input id="authPassword" type="password" placeholder="6 أحرف أو أكثر" class="w-full px-4 py-3 rounded-2xl bg-slate-950 border border-slate-800 text-white text-sm focus:outline-none focus:border-amber-500">
                </div>
                <p id="authError" class="text-xs text-rose-400 font-bold hidden"></p>
                <button id="authSubmitBtn" type="button" onclick="handleAuthSubmit()" class="w-full py-3.5 rounded-2xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-sm transition cursor-pointer">
                    تسجيل الدخول
                </button>
            </div>

            <div class="text-center pt-2 border-t border-slate-800">
                <button id="toggleAuthModeBtn" type="button" onclick="toggleAuthMode()" class="text-xs font-bold text-amber-400 hover:underline cursor-pointer">
                    ليس لديك حساب؟ إنشاء حساب جديد
                </button>
            </div>
        </div>
    </div>

    <!-- التطبيق الرئيسي بعد تسجيل الدخول -->
    <div id="appShell" class="hidden">
        <header class="sticky top-0 z-40 bg-slate-900/95 backdrop-blur border-b border-slate-800 px-4 py-3.5 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-amber-500 to-yellow-300 flex items-center justify-center text-slate-950 font-black text-xl shadow-md shadow-amber-500/20">
                    A
                </div>
                <div>
                    <h2 class="font-black text-base text-white">AuraVest</h2>
                    <p id="userEmailDisplay" class="text-[11px] text-slate-400">مرحباً بك</p>
                </div>
            </div>
            <button type="button" onclick="handleLogout()" class="px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold text-rose-400 transition cursor-pointer">
                <i class="fa-solid fa-right-from-bracket ml-1"></i> خروج
            </button>
        </header>

        <main class="max-w-2xl mx-auto p-4 space-y-5">
            <!-- تبويب المحفظة -->
            <section id="tab-wallet" class="tab-content active space-y-4">
                <div class="bg-gradient-to-br from-slate-900 to-slate-950 border border-slate-800 rounded-3xl p-5 space-y-3">
                    <p class="text-xs text-slate-400 font-bold">رصيد المحفظة الحالي</p>
                    <div class="flex items-baseline justify-between">
                        <h3 id="balanceDisplay" class="text-3xl font-black text-amber-400">$0.00</h3>
                        <span class="text-xs text-emerald-400 font-bold">متصل بـ Firebase</span>
                    </div>
                    <div class="pt-3 border-t border-slate-800/80 flex gap-2">
                        <input id="depositAmount" type="number" min="1" step="any" placeholder="مبلغ الإيداع (مثال: 100)" class="flex-1 px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-sm text-white focus:outline-none focus:border-amber-500">
                        <button type="button" onclick="handleDeposit()" class="px-4 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs transition cursor-pointer">
                            إيداع
                        </button>
                    </div>
                    <p id="walletStatus" class="text-xs text-slate-400"></p>
                </div>
            </section>

            <!-- تبويب الاستثمارات -->
            <section id="tab-invest" class="tab-content space-y-4">
                <div class="bg-slate-900 border border-slate-800 rounded-3xl p-5 space-y-2">
                    <h3 class="font-black text-base text-amber-400">خطط الاستثمار</h3>
                    <p class="text-xs text-slate-400">ستتم إضافة الفرص والخطط الاستثمارية هنا وتحديثها مباشرة مع رصيدك.</p>
                </div>
            </section>
        </main>

        <!-- شريط التنقل السفلي -->
        <nav class="fixed bottom-0 inset-x-0 z-40 bg-slate-900/95 backdrop-blur border-t border-slate-800 px-6 py-2.5 flex justify-around">
            <button type="button" onclick="switchTab('wallet')" class="flex flex-col items-center gap-1 text-amber-400 text-xs font-bold cursor-pointer">
                <i class="fa-solid fa-wallet text-base"></i>
                <span>المحفظة</span>
            </button>
            <button type="button" onclick="switchTab('invest')" class="flex flex-col items-center gap-1 text-slate-400 hover:text-white text-xs font-bold cursor-pointer">
                <i class="fa-solid fa-chart-line text-base"></i>
                <span>الاستثمار</span>
            </button>
        </nav>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import {
            getAuth,
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword,
            signOut,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import {
            getFirestore,
            doc,
            getDoc,
            setDoc,
            updateDoc,
            increment
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDq9NKD9UQAVDn-JXOhs_P-cYqyK_JSXow",
            authDomain: "auravest-7b7e6.firebaseapp.com",
            projectId: "auravest-7b7e6",
            storageBucket: "auravest-7b7e6.firebasestorage.app",
            messagingSenderId: "771361132365",
            appId: "1:771361132365:web:fef80d71e17f2c751c7104",
            measurementId: "G-W9F5K6P98X"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let isRegisterMode = false;
        let currentBalance = 0;

        const authScreen = document.getElementById("authScreen");
        const appShell = document.getElementById("appShell");
        const authSubtitle = document.getElementById("authSubtitle");
        const authEmail = document.getElementById("authEmail");
        const authPassword = document.getElementById("authPassword");
        const authError = document.getElementById("authError");
        const authSubmitBtn = document.getElementById("authSubmitBtn");
        const toggleAuthModeBtn = document.getElementById("toggleAuthModeBtn");
        const userEmailDisplay = document.getElementById("userEmailDisplay");
        const balanceDisplay = document.getElementById("balanceDisplay");
        const walletStatus = document.getElementById("walletStatus");

        function showError(msg) {
            authError.textContent = msg;
            authError.classList.remove("hidden");
        }

        function clearError() {
            authError.textContent = "";
            authError.classList.add("hidden");
        }

        window.toggleAuthMode = function () {
            isRegisterMode = !isRegisterMode;
            clearError();
            if (isRegisterMode) {
                authSubtitle.textContent = "أنشئ حساباً جديداً للبدء في AuraVest";
                authSubmitBtn.textContent = "إنشاء حساب جديد";
                toggleAuthModeBtn.textContent = "لديك حساب بالفعل؟ تسجيل الدخول";
            } else {
                authSubtitle.textContent = "سجل دخولك لمتابعة محفظتك واستثماراتك";
                authSubmitBtn.textContent = "تسجيل الدخول";
                toggleAuthModeBtn.textContent = "ليس لديك حساب؟ إنشاء حساب جديد";
            }
        };

        window.handleAuthSubmit = async function () {
            clearError();
            const email = authEmail.value.trim();
            const password = authPassword.value;

            if (!email || !password) {
                showError("يرجى إدخال البريد الإلكتروني وكلمة المرور.");
                return;
            }
            if (password.length < 6) {
                showError("كلمة المرور يجب أن تكون 6 أحرف أو أكثر.");
                return;
            }

            authSubmitBtn.disabled = true;
            authSubmitBtn.textContent = "جاري المعالجة...";

            try {
                if (isRegisterMode) {
                    const cred = await createUserWithEmailAndPassword(auth, email, password);
                    await setDoc(doc(db, "users", cred.user.uid), {
                        email: cred.user.email,
                        balance: 0,
                        createdAt: new Date().toISOString()
                    });
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                }
            } catch (err) {
                showError("تعذر إتمام العملية: " + err.message);
            } finally {
                authSubmitBtn.disabled = false;
                authSubmitBtn.textContent = isRegisterMode ? "إنشاء حساب جديد" : "تسجيل الدخول";
            }
        };

        window.handleLogout = async function () {
            await signOut(auth);
        };

        window.handleDeposit = async function () {
            const user = auth.currentUser;
            const input = document.getElementById("depositAmount");
            const amount = parseFloat(input.value);

            if (!user) return;
            if (isNaN(amount) || amount <= 0) {
                walletStatus.textContent = "أدخل مبلغاً صحيحاً أكبر من صفر.";
                walletStatus.className = "text-xs text-rose-400";
                return;
            }

            try {
                const userRef = doc(db, "users", user.uid);
                await setDoc(userRef, { email: user.email, balance: increment(amount) }, { merge: true });
                currentBalance += amount;
                balanceDisplay.textContent = "$" + currentBalance.toFixed(2);
                input.value = "";
                walletStatus.textContent = "تم تحديث الرصيد وحفظه في قاعدة البيانات.";
                walletStatus.className = "text-xs text-emerald-400";
            } catch (err) {
                walletStatus.textContent = "خطأ أثناء حفظ الرصيد: " + err.message;
                walletStatus.className = "text-xs text-rose-400";
            }
        };

        window.switchTab = function (tabName) {
            document.querySelectorAll(".tab-content").forEach((el) => el.classList.remove("active"));
            const target = document.getElementById("tab-" + tabName);
            if (target) target.classList.add("active");
        };

        async function loadUserWallet(user) {
            userEmailDisplay.textContent = user.email || "مستخدم مسجل";
            try {
                const snap = await getDoc(doc(db, "users", user.uid));
                if (snap.exists()) {
                    currentBalance = Number(snap.data().balance || 0);
                } else {
                    currentBalance = 0;
                }
                balanceDisplay.textContent = "$" + currentBalance.toFixed(2);
            } catch (err) {
                balanceDisplay.textContent = "$0.00";
                walletStatus.textContent = "ملاحظة: تحقق من قواعد Firestore إذا ظهر خطأ صلاحيات.";
                walletStatus.className = "text-xs text-amber-400";
            }
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                authScreen.classList.add("hidden");
                appShell.classList.remove("hidden");
                await loadUserWallet(user);
            } else {
                appShell.classList.add("hidden");
                authScreen.classList.remove("hidden");
            }
        });
    </script>
</body>
</html>
